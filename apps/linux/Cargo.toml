[workspace]

[package]
name = "hortus-linux"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Native GTK4 and libadwaita Markdown reader and editor with local diagrams, math, and Agent review"
homepage = "https://github.com/groundgrounder/Hortus"
repository = "https://github.com/groundgrounder/Hortus"

[features]
default = []
automation = []

[[bin]]
name = "hortus-gtk"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "=0.11.5", features = ["v4_16"] }
libadwaita = { version = "=0.9.2", features = ["v1_6"] }
vte4 = { version = "=0.10.0", features = ["v0_76"] }
libc = "=0.2.191"
cairo-rs = { version = "=0.22.11", features = ["pdf", "png"] }
pango = "=0.22.9"
roxmltree = "=0.20.0"
glib = "=0.22.11"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
hortus-ffi = { path = "../../crates/hortus-ffi" }
hortus-config = { path = "../../crates/hortus-config" }
hortus-diagram = { path = "../../crates/hortus-diagram" }
hortus-document = { path = "../../crates/hortus-document" }
hortus-links = { path = "../../crates/hortus-links" }
hortus-math = { path = "../../crates/hortus-math" }
hortus-vault = { path = "../../crates/hortus-vault" }

[dev-dependencies]
tempfile = "=3.27.0"

[package.metadata.deb]
maintainer = "groundgrounder"
copyright = "2026, groundgrounder"
license-file = ["../LICENSE", "0"]
depends = "$auto, gsettings-desktop-schemas, adwaita-icon-theme, hicolor-icon-theme"
section = "editors"
priority = "optional"
assets = [
    ["target/release/hortus-gtk", "usr/bin/hortus-gtk", "755"],
    ["data/io.github.groundgrounder.Hortus.desktop", "usr/share/applications/io.github.groundgrounder.Hortus.desktop", "644"],
    ["data/io.github.groundgrounder.Hortus.metainfo.xml", "usr/share/metainfo/io.github.groundgrounder.Hortus.metainfo.xml", "644"],
    ["data/icons/hicolor/scalable/apps/io.github.groundgrounder.Hortus.svg", "usr/share/icons/hicolor/scalable/apps/io.github.groundgrounder.Hortus.svg", "644"],
    ["data/THIRD_PARTY_NOTICES.txt", "usr/share/licenses/hortus-linux/THIRD_PARTY_NOTICES.txt", "644"],
    ["../macos/Resources/Fonts/KaTeX/*", "usr/share/hortus/fonts/KaTeX/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/hortus-gtk", dest = "/usr/bin/hortus-gtk", mode = "755" },
    { source = "data/io.github.groundgrounder.Hortus.desktop", dest = "/usr/share/applications/io.github.groundgrounder.Hortus.desktop", mode = "644" },
    { source = "data/io.github.groundgrounder.Hortus.metainfo.xml", dest = "/usr/share/metainfo/io.github.groundgrounder.Hortus.metainfo.xml", mode = "644" },
    { source = "data/icons/hicolor/scalable/apps/io.github.groundgrounder.Hortus.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.groundgrounder.Hortus.svg", mode = "644" },
    { source = "data/THIRD_PARTY_NOTICES.txt", dest = "/usr/share/licenses/hortus-linux/THIRD_PARTY_NOTICES.txt", mode = "644" },
    { source = "../macos/Resources/Fonts/KaTeX/*", dest = "/usr/share/hortus/fonts/KaTeX/", mode = "644" },
]
