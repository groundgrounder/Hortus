[workspace]
members = ["crates/hortus-math", "crates/hortus-diagram", "crates/hortus-cli", "crates/hortus-vault", "crates/hortus-config", "crates/hortus-document", "crates/hortus-search", "crates/hortus-history", "crates/hortus-ffi", "crates/hortus-links"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
fontdb = "=0.23.0"
rustybuzz = "=0.20.1"
unicode-segmentation = "=1.12.0"
csscolorparser = "=0.9.0"
