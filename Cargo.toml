[workspace]
members = ["crates/hortus-diagram", "crates/hortus-cli", "crates/hortus-vault", "crates/hortus-config", "crates/hortus-document", "crates/hortus-search", "crates/hortus-ffi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
fontdb = "=0.23.0"
rustybuzz = "=0.20.1"
unicode-segmentation = "=1.12.0"
csscolorparser = "=0.9.0"
